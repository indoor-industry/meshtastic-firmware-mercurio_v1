; Mercurio v1 - Custom ESP32-S3-N16R8 board
; SX1262 LoRa + ILI9341 TFT + Quectel L76KB GPS + MCP23017 I/O expander
;
; SPI bus layout:
;   SPI1 (SPI3_HOST/HSPI): LoRa SX1262 (SCK=38, MOSI=39, MISO=41)
;   SPI  (SPI2_HOST):      ILI9341 display + microSD (SCK=14, MOSI=13, MISO=12)
;
; Board netlist: test_firmware/LoRa-device.net (verified 2026-05-13)

[env:mercurio-v1]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = MERCURIO_V1
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = Mercurio v1
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board = mercurio_v1
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool
upload_speed = 921600

extra_scripts =
  ${env.extra_scripts}
  pre:variants/esp32s3/mercurio_v1/patch_audio_i2s_mclk.py

build_flags =
  ${esp32s3_base.build_flags}
  -D MERCURIO_V1
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/mercurio_v1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/mercurio_v1>

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

; MUI (meshtastic/device-ui) build: compiles both the basic UI above and
; MUI into one binary. Pick at runtime from the device menu
; ("Switch to MUI" / DisplayMode_COLOR vs DEFAULT).
[env:mercurio-v1-tft]
extends = env:mercurio-v1

extra_scripts =
  ${env.extra_scripts}
  pre:variants/esp32s3/mercurio_v1/patch_audio_i2s_mclk.py
  pre:variants/esp32s3/mercurio_v1/patch_device_ui_portrait.py
  pre:variants/esp32s3/mercurio_v1/patch_device_ui_map_fetch.py
  pre:variants/esp32s3/mercurio_v1/patch_device_ui_tile_provider.py

build_flags =
  ${env:mercurio-v1.build_flags}
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D LGFX_CFG_HOST=SPI2_HOST
  -D LGFX_PIN_SCK=14
  -D LGFX_PIN_MOSI=13
  -D LGFX_PIN_MISO=12
  -D LGFX_PIN_DC=15
  -D LGFX_PIN_CS=18
  -D LGFX_PIN_RST=-1
  -D LGFX_PIN_BL=11
  -D LGFX_PANEL=ILI9341
  ; LGFX_GENERIC.h defaults this to true, which inverts colors on this panel.
  -D LGFX_INVERT_COLOR=false
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  ; Portrait, matching the panel's native mounting. Switching VIEW_*
  ; requires a clean wipe of this env's .pio build/libdeps - device-ui's
  ; extra_script.py picks the generated UI source folder via a one-time
  ; CPPDEFINES scan, not a tracked dependency.
  -D DISPLAY_SIZE=240x320
  -D VIEW_240x320
  -D LGFX_ROTATION=2 ; rotation=0 was upside-down; 2 (180 deg) is upright.
  ; lv_conf.h defaults RAM_SIZE to 96(KB), too small for device-ui's
  ; generated screens - causes lv_obj_create() to return NULL and hang.
  ; Matches T-Deck/tlora-pager; mercurio_v1's 8MB PSRAM has headroom.
  -D RAM_SIZE=5120
  -D LGFX_TOUCH=XPT2046
  -D LGFX_TOUCH_SPI_HOST=2 ; SPI3_HOST/HSPI, shared with LoRa
  -D LGFX_TOUCH_SPI_FREQ=2500000
  -D LGFX_TOUCH_CS=6
  -D LGFX_TOUCH_CLK=38 ; = LORA_SCK
  -D LGFX_TOUCH_DIN=39 ; = LORA_MOSI
  -D LGFX_TOUCH_DO=41  ; = LORA_MISO
  ; Combined rotation is (panel + touch) & 3; 2 here cancels LGFX_ROTATION's
  ; 2 to land on identity (no swap, no flip).
  -D LGFX_TOUCH_ROTATION=2
  ; Measured via the on-device tap-to-calibrate UI (CALIBRATE_TOUCH) with
  ; this rotation in effect.
  -D LGFX_TOUCH_X_MIN=391
  -D LGFX_TOUCH_X_MAX=3736
  -D LGFX_TOUCH_Y_MIN=3843
  -D LGFX_TOUCH_Y_MAX=416
  ; SD card shares the display's hardware SPI bus (SCK=14/MOSI=13/MISO=12),
  ; same as T-Deck and tlora-pager - no custom driver needed.
  -D HAS_SDCARD

lib_deps =
  ${env:mercurio-v1.lib_deps}
  ${device-ui_base.lib_deps}
