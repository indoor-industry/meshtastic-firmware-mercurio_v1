; Mercurio v1 - Custom ESP32-S3-N16R8 board
; SX1262 LoRa + ILI9341 TFT + Quectel L76KB GPS + MCP23017 I/O expander
;
; SPI bus layout:
;   SPI1 (SPI3_HOST/HSPI): LoRa SX1262 (SCK=38, MOSI=39, MISO=41)
;   SPI  (SPI2_HOST):      ILI9341 display + microSD (SCK=14, MOSI=13, MISO=12)
;
; Board netlist: test_firmware/LoRa-device.net (verified 2026-05-13)

[env:mercurio-v1]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = MERCURIO_V1
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = Mercurio v1
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board = mercurio_v1
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool
upload_speed = 921600

build_flags =
  ${esp32s3_base.build_flags}
  -D MERCURIO_V1
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/mercurio_v1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/mercurio_v1>

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21

; MUI (meshtastic/device-ui) build: compiles both the basic UI above and
; MUI into one binary. Pick at runtime from the device menu
; ("Switch to MUI" / DisplayMode_COLOR vs DEFAULT).
[env:mercurio-v1-tft]
extends = env:mercurio-v1

build_flags =
  ${env:mercurio-v1.build_flags}
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D LGFX_CFG_HOST=SPI2_HOST
  -D LGFX_PIN_SCK=14
  -D LGFX_PIN_MOSI=13
  -D LGFX_PIN_MISO=12
  -D LGFX_PIN_DC=15
  -D LGFX_PIN_CS=18
  -D LGFX_PIN_RST=-1
  -D LGFX_PIN_BL=11
  -D LGFX_PANEL=ILI9341
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D DISPLAY_SIZE=320x240 ; landscape mode. device-ui only ships a TFT View
                          ; class for 320x240 (TFTView_320x240.cpp); the
                          ; "ui_240x320" generated assets exist but there is
                          ; no TFTView_240x320.cpp to drive them, so portrait
                          ; isn't actually implemented for TFT - confirmed by
                          ; ls'ing source/graphics/TFT/. Forcing VIEW_240x320
                          ; just rendered the landscape layout into a
                          ; 240-wide buffer, cutting it in half.
  -D VIEW_320x240
  -D LGFX_ROTATION=3 ; offset_rotation: panel is wired native-portrait
                      ; (240x320); 3 swaps W/H to landscape and adds the half
                      ; turn needed to sit upright. Confirmed correct/upright
                      ; on device.
  ; LVGL's internal object/style heap size; lv_conf.h defaults RAM_SIZE to 96
  ; (KB) when undefined, which is nowhere near enough for device-ui's
  ; generated 320x240 screens. Without this, lv_obj_create() silently starts
  ; returning NULL partway through ui_init(), and the very next
  ; lv_obj_set_pos(NULL, ...) hits an LVGL assert that spins forever while
  ; holding spiLock - manifesting as a permanent hang/white screen with the
  ; whole device deadlocked (confirmed via JTAG/gdb backtrace). Matches
  ; T-Deck/tlora-pager's value; mercurio_v1 has 8MB PSRAM and LV_MEM_POOL_ALLOC
  ; pulls from PSRAM (see lv_conf.h), so there's ample headroom.
  -D RAM_SIZE=5120
  -D LGFX_TOUCH=XPT2046
  -D LGFX_TOUCH_SPI_HOST=2 ; SPI3_HOST/HSPI, shared with LoRa
  -D LGFX_TOUCH_SPI_FREQ=2500000
  -D LGFX_TOUCH_CS=6
  -D LGFX_TOUCH_CLK=38 ; = LORA_SCK
  -D LGFX_TOUCH_DIN=39 ; = LORA_MOSI
  -D LGFX_TOUCH_DO=41  ; = LORA_MISO
  ; Touch's own offset_rotation. Panel_Device::convertRawXY combines this
  ; with the panel's rotation as (panel_r + touch_offset) & 3 to pick one of
  ; 4 transform patterns (see LGFXBase.cpp/Panel_Device.cpp): r=1 is
  ; "swap X/Y, then flip the post-swap Y" - exactly the basic UI's working
  ; raw calibration (TOUCH_SWAP_XY=1, TOUCH_INVERT_X=0, TOUCH_INVERT_Y=1 in
  ; variant.h). Panel rotation here is 3 (LGFX_ROTATION above), and we need
  ; the combined value to land on 1, so touch_offset = (1 - 3) mod 4 = 2.
  -D LGFX_TOUCH_ROTATION=2
  -D LGFX_TOUCH_X_MIN=300
  -D LGFX_TOUCH_X_MAX=3900
  ; Reversed (max/min swapped) on purpose. Panel_Device::touchCalibrate()
  ; builds an affine map from these corners *before* convertRawXY's
  ; swap+flip runs; with our combined rotation (panel=3, touch offset=2,
  ; combined=1 -> swap+Y-flip), the Y-calibrated axis ends up driving the
  ; final *screen-X* coordinate unflipped. Screen-X was mirrored while
  ; screen-Y was correct, so inverting this range (not the X one) flips
  ; exactly the axis that needed it.
  -D LGFX_TOUCH_Y_MIN=3900
  -D LGFX_TOUCH_Y_MAX=400

lib_deps =
  ${env:mercurio-v1.lib_deps}
  ${device-ui_base.lib_deps}
